
<section class="enquiry-section" id="enquiry">
  <div class="enquiry-container">

    <div class="enquiry-heading">
      <span class="section-label">LET'S BUILD TOGETHER</span>
      <h2>Start Your <span>Project</span></h2>
      <p>
        Tell us about your construction project. Our team will contact
        you to discuss your requirements.
      </p>
    </div>

    <form
      class="enquiry-form"
      #enquiryForm="ngForm"
      (ngSubmit)="submitEnquiry()"
    >
      <div class="form-grid">

        <div class="form-group">
          <label for="name">Full Name *</label>
          <input
            id="name"
            type="text"
            name="name"
            [(ngModel)]="form.name"
            placeholder="Enter your full name"
            maxlength="100"
            autocomplete="name"
            required
          />
        </div>

        <div class="form-group">
          <label for="phone">Phone Number *</label>
          <input
            id="phone"
            type="tel"
            name="phone"
            [(ngModel)]="form.phone"
            placeholder="Enter your phone number"
            maxlength="25"
            autocomplete="tel"
            required
          />
        </div>

        <div class="form-group">
          <label for="email">Email Address *</label>
          <input
            id="email"
            type="email"
            name="email"
            [(ngModel)]="form.email"
            placeholder="Enter your email address"
            maxlength="254"
            autocomplete="email"
            required
          />
        </div>

        <div class="form-group">
          <label for="city">City / Location</label>
          <input
            id="city"
            type="text"
            name="city"
            [(ngModel)]="form.city"
            placeholder="Where is your project located?"
            maxlength="100"
            autocomplete="address-level2"
          />
        </div>

        <div class="form-group">
          <label for="service">Required Service *</label>
          <select
            id="service"
            name="service"
            [(ngModel)]="form.service"
            required
          >
            <option value="" disabled>Select a service</option>
            <option value="Construction">Construction</option>
            <option value="Project Management Consultancy">
              Project Management Consultancy (PMC)
            </option>
            <option value="Architectural Planning">
              Architectural Planning
            </option>
            <option value="Interior Design">Interior Design</option>
            <option value="Renovation">Renovation</option>
            <option value="Other">Other</option>
          </select>
        </div>

        <div class="form-group">
          <label for="projectType">Project Type</label>
          <select
            id="projectType"
            name="projectType"
            [(ngModel)]="form.projectType"
          >
            <option value="">Select project type</option>
            <option value="Residential">Residential</option>
            <option value="Commercial">Commercial</option>
            <option value="Industrial">Industrial</option>
            <option value="Institutional">Institutional</option>
            <option value="Other">Other</option>
          </select>
        </div>

        <div class="form-group">
          <label for="budget">Estimated Budget</label>
          <select
            id="budget"
            name="budget"
            [(ngModel)]="form.budget"
          >
            <option value="">Select your budget</option>
            <option value="Below ₹10 Lakhs">Below ₹10 Lakhs</option>
            <option value="₹10–25 Lakhs">₹10–25 Lakhs</option>
            <option value="₹25–50 Lakhs">₹25–50 Lakhs</option>
            <option value="₹50 Lakhs–1 Crore">₹50 Lakhs–1 Crore</option>
            <option value="Above ₹1 Crore">Above ₹1 Crore</option>
            <option value="Not Decided">Not Decided</option>
          </select>
        </div>

        <div class="form-group">
          <label for="startDate">Expected Start Date</label>
          <input
            id="startDate"
            type="date"
            name="startDate"
            [(ngModel)]="form.startDate"
          />
        </div>

        <div class="form-group full-width">
          <label for="message">Project Details *</label>
          <textarea
            id="message"
            name="message"
            [(ngModel)]="form.message"
            placeholder="Describe your project and requirements..."
            rows="5"
            maxlength="3000"
            required
          ></textarea>
        </div>

        <div class="form-group">
          <label for="preferredContact">Preferred Contact Method</label>
          <select
            id="preferredContact"
            name="preferredContact"
            [(ngModel)]="form.preferredContact"
          >
            <option value="Phone">Phone Call</option>
            <option value="Email">Email</option>
            <option value="WhatsApp">WhatsApp</option>
          </select>
        </div>

        <!-- Spam protection: keep this field empty -->
        <div class="honeypot" aria-hidden="true">
          <label for="website">Website</label>
          <input
            id="website"
            type="text"
            name="website"
            [(ngModel)]="form.website"
            tabindex="-1"
            autocomplete="off"
          />
        </div>

      </div>

      <button
        type="submit"
        class="submit-btn"
        [disabled]="isSubmitting || enquiryForm.invalid"
      >
        {{ isSubmitting ? 'Submitting...' : 'Submit Enquiry' }}
      </button>

      <p
        class="form-status"
        *ngIf="statusMessage"
        role="status"
        aria-live="polite"
      >
        {{ statusMessage }}
      </p>

      <p class="form-note">
        Your information will only be used to respond to your enquiry.
      </p>
    </form>

  </div>
</section>
